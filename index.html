<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Tamm</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<link rel="manifest" href="manifest.json?v=tamm4"><link rel="icon" href="tamm-icon-192.png"><meta name="theme-color" content="#FBFAF6"><link rel="apple-touch-icon" href="tamm-touch-180.png?v=4"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Tamm"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Lalezar&display=swap" rel="stylesheet">
<style>
:root{--ink:#101113;--ink2:#243A66;--teal:#2563EB;--teal2:#1D4ED8;--amber:#B45309;--red:#EA580C;--green:#16A34A;--paper:#EFF1EF;--card:#fff;--line:#ECEDEF;--muted:#8A8F98;--r:18px;--side:#fff;--lime:#CDF663;--lime2:#C2EF52;--limeink:#1F2E05;--sh:0 1px 2px rgba(16,17,19,.04),0 8px 24px rgba(16,17,19,.05)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"IBM Plex Sans","Segoe UI",Arial,sans-serif;background:var(--paper);color:var(--ink);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums lining-nums}
a{color:var(--teal2)}
[dir=rtl] body,[dir=rtl] button,[dir=rtl] input,[dir=rtl] select,[dir=rtl] textarea{font-family:"IBM Plex Sans Arabic","IBM Plex Sans",Tahoma,Arial,sans-serif}
button{font-family:inherit}
/* layout */
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:8px 18px;height:56px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.3px}
.brand svg{width:32px;height:32px}.brand .nm{color:var(--ink);font-weight:800;letter-spacing:-.4px}
.brand .biz{font-weight:500;color:var(--muted);font-size:13px;display:block;line-height:1.1}
.spacer{flex:1}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:none;border:0;padding:6px 11px;cursor:pointer;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--ink);color:#fff;font-weight:700}
.icobtn{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 8px;cursor:pointer;font-size:13px;color:var(--ink);display:flex;align-items:center}.icobtn svg{width:16px;height:16px}
.wrap{display:flex;min-height:calc(100vh - 56px)}
.tabs{background:var(--side);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px;width:220px;flex:none;position:sticky;top:56px;height:calc(100vh - 56px);gap:2px}
.tabs button{text-align:start;border-radius:10px;padding:10px 12px;border-bottom:0!important;color:var(--muted);font-size:14px;font-weight:500}
.tabs button:hover{background:#F3F5F8;color:var(--ink)}
.tabs button.on{background:#EEF4FF;color:var(--teal2);font-weight:700}
.tabs .more{display:none}
.ph{display:flex;align-items:flex-end;gap:12px;margin-bottom:14px}.ph h1{font-size:24px;letter-spacing:-.4px}.ph p{color:var(--muted);font-size:13px;margin-top:2px}.ph .spacer{flex:1}
.tabs button .ic{width:18px;height:18px;display:inline-flex}.tabs button .ic svg{width:18px;height:18px}
.tabs .addnav{background:var(--lime);color:var(--limeink)!important;font-weight:800;justify-content:center;margin-bottom:14px;box-shadow:0 4px 12px rgba(180,230,60,.5)}
.tabs .addnav:hover{background:var(--lime2)}
main{flex:1;min-width:0}

.tabs button{background:none;border:0;padding:12px 14px;font-size:14px;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tabs button.on{font-weight:700}
main{max-width:1120px;margin:0 auto;padding:18px 16px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-top:14px;box-shadow:var(--sh)}
.card h2{font-size:14px;color:var(--ink);margin:-18px -18px 14px;padding:12px 18px;border-bottom:1px solid var(--line);font-weight:600}
.grid2{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
/* hero */
.banner{background:linear-gradient(120deg,#D8F97E,#C2EF52 60%,#B8EA44);border-radius:var(--r);padding:18px 20px;margin:0 0 14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}.banner b{font-size:18px;font-weight:800;letter-spacing:-.3px;color:#17230A}.banner .hl{background:#F2FFC9;border-radius:6px;padding:0 6px}.banner p{font-size:13px;color:#3C511B;margin:3px 0 0}.banner .act{margin-inline-start:auto;background:#fff;border:0;cursor:pointer;border-radius:20px;padding:10px 18px;font-weight:700;font-size:13px;color:#17230A;box-shadow:var(--sh);font-family:inherit}.hero{margin-top:0;background:linear-gradient(120deg,#E9FAB9,#DCF592 70%,#D3F27F);border:0;box-shadow:none;color:var(--ink);border-radius:var(--r);padding:12px;display:grid;gap:12px;grid-template-columns:1.5fr 1fr 1fr 1fr}.hero>div{background:#fff;border-radius:14px;padding:12px;box-shadow:0 1px 2px rgba(16,17,19,.05)}.hero>div+div{border:0;padding-inline-start:12px}
.hero .l{font-size:12px;color:#57661D;text-transform:uppercase;letter-spacing:.6px}
.hero .big{font-size:36px;font-weight:800;line-height:1.05;letter-spacing:-1px;margin-top:4px;color:var(--ink)}.hero .big small{color:var(--muted);font-weight:500}.hero small{color:var(--muted)}.hero .mid.amb{color:#B45309}.hero .mid.neg{color:#EA580C}.hero .mid{color:var(--ink)}
.hero .mid{font-size:24px;font-weight:700;margin-top:4px}
.hero small{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.hero .pos{color:var(--green)}.hero .neg{color:var(--red)}.hero .amb{color:#D9822B}
.items{width:100%;border-top:1px solid var(--line);padding-top:12px;margin-top:4px}.items input{padding:8px 9px!important}.items .r{display:grid;grid-template-columns:1fr 70px 90px 90px 28px;gap:6px;margin-bottom:6px;align-items:center}.items .r .ln{text-align:end;font-weight:600}
.recv{display:grid;grid-template-columns:1fr 1fr;gap:12px}.recv>div{padding:12px;border-radius:10px;background:#F9FAFB;border:1px solid var(--line)}
.st{font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;border-radius:14px}.st.paid{color:var(--green)}.st.partial{color:#B76A1F}.st.open{color:var(--teal2)}.st.overdue{color:var(--red)}
.tbl tr{cursor:pointer}.tbl tr:hover td{background:#F9FAFB}
.donut{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.donut svg{width:150px;height:150px;flex:none}.donut .lg{font-size:13px;display:grid;gap:6px;min-width:0;flex:1}.donut .lg div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.donut .lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:6px}
.split{display:flex;gap:10px;justify-content:flex-end;align-items:center;margin-top:10px;flex-wrap:nowrap}.form .split input,.form .items .split input{width:90px;flex:none}
.sel{display:flex;align-items:center;gap:8px}.sel select{padding:5px 8px;border:1px solid var(--line);border-radius:7px;font-size:13px;font-family:inherit}
.recvbar{height:8px;border-radius:4px;background:#E4E7EC;overflow:hidden;display:flex;margin-top:12px}.recvbar i{display:block;height:100%}.recv .l{font-size:11px;color:var(--muted);text-transform:uppercase}.recv .v{font-size:22px;font-weight:800}
/* kpi tiles */
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-top:14px}
.tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;box-shadow:var(--sh)}
.tile:hover{border-color:var(--teal)}
.tile .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.tile .v{font-size:21px;font-weight:800;margin-top:2px}
.tile .s{font-size:12px;color:var(--muted)}
/* chart */
.chart{display:flex;gap:10px;align-items:flex-end;height:190px;padding-top:6px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:44px}
.chart .bars{display:flex;gap:3px;align-items:flex-end;height:140px;width:100%;justify-content:center;border-bottom:1px solid var(--line)}
.chart .bars .bw{width:30%;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}.chart .bars i{display:block;width:100%;border-radius:4px 4px 0 0;min-height:2px}.chart .bv{font-size:10px;color:var(--muted);margin-bottom:2px;white-space:nowrap}
.g{background:var(--green)}.rd{background:var(--red)}.tl{background:#17230A}
.chart .lbl{font-size:11px;color:var(--muted);white-space:nowrap}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:4px;vertical-align:middle}
.hbar{display:grid;grid-template-columns:150px 1fr 90px;gap:10px;align-items:center;padding:6px 0;font-size:14px}
.hbar .trk{height:10px;background:#EDF0F5;border-radius:5px;overflow:hidden}.hbar .trk i{display:block;height:100%;border-radius:5px}
/* lists */
.row{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}.row:hover{background:#FAFBFD}
.av{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex:none;color:#fff}
.row .txt{flex:1;min-width:0}.row .txt b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .txt span{font-size:12px;color:var(--muted)}
.row .amt{text-align:end;font-weight:700;white-space:nowrap}.row .amt span{display:block;font-size:12px;font-weight:400}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.pill.paid{background:#E1F5EC;color:var(--green)}.pill.partial{background:#FFF1DF;color:#B76A1F}.pill.open{background:#E8F0FB;color:#2B5DAE}.pill.overdue{background:#FBE4DF;color:var(--red)}
.toolbar{display:flex;gap:8px;align-items:center;margin:14px 0 0;flex-wrap:wrap}
.toolbar input[type=search]{flex:1;min-width:160px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;font-size:14px;font-family:inherit}
.chip{background:#fff;border:1px solid var(--line);border-radius:20px;padding:8px 15px;font-size:13px;cursor:pointer;color:#5f646b}
.chip.on{background:var(--lime);color:var(--limeink);border-color:transparent;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:start}
th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;background:#F9FAFB}
td.num,th.num{text-align:end;white-space:nowrap}
/* buttons & forms */
.btn{background:#111827;color:#fff;border:0;padding:10px 18px;border-radius:12px;cursor:pointer;font-size:14px;font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.15)}.btn:hover{background:#1F2937}.btn:active{transform:translateY(1px)}.btn:hover{filter:brightness(.95)}
.btn.teal{background:var(--teal)}.btn.line{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.sm{padding:6px 10px;font-size:12px}.btn.danger{color:#C0392B;border:1.5px solid #F1B8B4;background:#FFF5F4;font-weight:700}.btn.danger:hover{background:#FDEDEA}
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.form label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600}
.form input,.form select,.form textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:9px;font-size:14px;font-family:inherit;background:#fff}
.form input:focus,.form select:focus,.form textarea:focus{outline:2px solid var(--teal);border-color:transparent}
.form .full{grid-column:1/-1}
.bigamt{font-size:26px!important;font-weight:800;text-align:center;letter-spacing:-.5px}
.snap{border:2px dashed var(--line);border-radius:12px;padding:14px;text-align:center;cursor:pointer;color:var(--muted);background:#FAFBFD;display:block}
.snap:hover{border-color:var(--teal);color:var(--ink)}.snap input{display:none}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}.gal img{width:100%;height:110px;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:pointer;background:#F3F5F8}
.thumbs .th{position:relative}.thumbs img{height:64px;border-radius:8px;border:1px solid var(--line);cursor:pointer}
.thumbs .th a{position:absolute;top:-6px;inset-inline-end:-6px;background:var(--red);color:#fff;border-radius:50%;width:20px;height:20px;font-size:12px;display:flex;align-items:center;justify-content:center;text-decoration:none}
.link{background:none;border:0;color:#4C6B10;cursor:pointer;font-size:13px;text-decoration:underline;padding:0}
.hidden{display:none!important}
/* modal / sheet */
.modal{position:fixed;inset:0;background:rgba(20,33,61,.5);display:none;align-items:flex-end;justify-content:center;z-index:30}
@media (min-width:901px){.modal{align-items:stretch;justify-content:flex-end;padding:0}.modal .sheet{border-radius:0;width:640px;max-width:640px;max-height:100vh;height:100vh;animation:slide .22s ease;box-shadow:-8px 0 30px rgba(20,33,61,.18)}[dir=rtl] .modal{justify-content:flex-start}[dir=rtl] .modal .sheet{animation-name:slideR;box-shadow:8px 0 30px rgba(20,33,61,.18)}.modal.center{align-items:center;justify-content:center;padding:20px}.modal.center .sheet{height:auto;width:100%;max-width:520px;max-height:90vh;border-radius:18px;animation:up .22s ease}}
@keyframes slide{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}@keyframes slideR{from{transform:translateX(-40px);opacity:0}to{transform:none;opacity:1}}
.modal.on{display:flex}
.sheet{background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:none;max-height:92vh;overflow:auto;padding:20px 20px 28px;animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sheet h3{font-size:18px;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.sheet h3 .spacer{flex:1}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.choice{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.choice button{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 12px;cursor:pointer;text-align:center}
.choice button:hover{border-color:var(--teal)}
.choice .ic{font-size:28px;display:block;margin-bottom:6px}.choice .ic svg{width:28px;height:28px}
.choice b{display:block;font-size:14px}.choice span{font-size:12px;color:var(--muted)}
.fab{position:fixed;bottom:22px;inset-inline-end:22px;background:var(--lime);color:var(--limeink);border:0;border-radius:30px;padding:14px 22px;font-size:16px;font-weight:800;box-shadow:0 8px 22px rgba(64,141,251,.45);cursor:pointer;z-index:25}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv b{font-weight:700}
.gate{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.gate .side{background:linear-gradient(150deg,#E4F8AE 0%,#CDF663 55%,#B8EA44 120%);color:#17230A;padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}.side::before{content:"";position:absolute;width:340px;height:340px;border-radius:50%;background:rgba(255,255,255,.35);top:-120px;inset-inline-end:-120px}.side::after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.25);bottom:-80px;inset-inline-start:-60px}.side>*{position:relative;z-index:1}
.gate .side svg{width:56px;height:56px}.gate .side h1{font-size:34px;letter-spacing:-.5px;margin-top:18px}.gate .side p{color:#3C511B;max-width:360px;margin-top:10px;font-size:15px}
.gate .side ul{list-style:none;color:#223409;font-size:15px;font-weight:500;display:grid;gap:12px}.gate .side li::before{content:"✓";color:#17230A;margin-inline-end:8px;font-weight:800}
.gate .pane{display:flex;align-items:center;justify-content:center;padding:32px;background:var(--paper)}
.gate .box{background:#fff;border-radius:18px;padding:36px 32px;max-width:380px;width:100%;text-align:center;border:1px solid var(--line);box-shadow:0 10px 40px rgba(16,24,40,.08)}
.gate .box h2{font-size:22px;margin-bottom:4px}
.dots{display:flex;gap:14px;justify-content:center;margin:22px 0}.dots i{width:16px;height:16px;border-radius:50%;border:2px solid #C7D0DD;display:block;transition:.15s}.dots i.f{background:#17230A;border-color:#17230A;transform:scale(1.1)}
.gate #pinIn{position:absolute;opacity:0;pointer-events:none}.gate .form input{position:static;opacity:1;pointer-events:auto}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:260px;margin:0 auto}.pad button{height:56px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:22px;font-weight:600;cursor:pointer;color:var(--ink)}.pad button:hover{background:#F2F6FF;border-color:#B9D3FF}.pad button.mut{font-size:14px;color:var(--muted)}

.hint{font-size:13px;color:var(--muted)}
.empty{padding:26px;text-align:center;color:var(--muted)}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:40}
.toast.on{opacity:1}
.muted{color:var(--muted);font-size:13px}
/* invoice print */
.inv{background:#fff;padding:28px;border:1px solid var(--line);border-radius:12px;max-width:640px;margin:0 auto}
.inv .head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;border-bottom:2px solid var(--ink);padding-bottom:14px}
.inv .head h1{font-size:26px;letter-spacing:-.5px}
.inv .logo{max-height:56px;max-width:160px}
.inv table td,.inv table th{padding:10px 6px}
.inv .tot{font-size:22px;font-weight:800}
@media print{body *{visibility:hidden}.printArea,.printArea *{visibility:visible}.printArea{position:absolute;inset:0;padding:0}.inv{border:0}}
.show-m{display:none}@media (max-width:900px){.hide-m{display:none}.show-m{display:block}}
@media (max-width:640px){.hide-m{display:none}}
@media (max-width:900px){.wrap{display:block}.top{height:52px;padding:6px 12px}.brand .biz{display:none}
.tabs{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));left:12px;right:12px;top:auto;height:auto;width:auto;flex-direction:row;background:#fff;border:0;border-radius:28px;box-shadow:0 10px 34px rgba(16,17,19,.16),0 2px 8px rgba(16,17,19,.08);border-inline-end:0;padding:8px 10px;z-index:15;gap:0}
.tabs button{flex:1;flex-direction:column;gap:3px;font-size:10.5px;padding:4px 0;align-items:center;justify-content:center;color:var(--muted);border-radius:0;font-weight:500}
.tabs button.on{background:none;color:var(--ink);font-weight:800;position:relative}.tabs button .ic svg{width:22px;height:22px}
.tabs .hm{display:none}.tabs .more{display:flex}
.tabs .addnav{flex:0 0 auto;order:3;margin:0;width:58px;height:58px;border-radius:50%;padding:0;gap:0;display:flex;align-items:center;justify-content:center;transform:translateY(-18px);box-shadow:0 0 0 5px #fff,0 10px 22px rgba(140,190,30,.55)}.tabs .addnav .ic{width:26px;height:26px;display:flex;align-items:center;justify-content:center}.tabs .addnav .ic svg{width:26px;height:26px;display:block}.tabs .addnav span:not(.ic){display:none}
.tabs button[data-k=home],.tabs button[data-k=sales]{order:1}.tabs button[data-k=exp]{order:4}.tabs .more{order:5}
.fab{display:none}main{padding:14px 12px 100px}.ph h1{font-size:20px}.card{padding:14px;border-radius:12px}.card h2{margin:-14px -14px 12px;padding:10px 14px}

<script>
/* ================= Tamm backend (Supabase) ================= */
const sb=window.supabase.createClient(TT_CONFIG.supabaseUrl,TT_CONFIG.supabaseKey);
let SESSION=null,BIZ=null,BIZLIST=[];
const dataUrlToBlob=d=>{const [m,b]=d.split(",");const mime=m.match(/:(.*?);/)[1];const bin=atob(b);const arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return new Blob([arr],{type:mime});};
const blobToDataUrl=b=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b);});
window.storage={
 async get(key){if(!BIZ)throw new Error("no business");
  if(key==="tt:data"){const {data,error}=await sb.from("business_data").select("data").eq("business_id",BIZ.id).maybeSingle();if(error)throw error;if(!data)throw new Error("nf");return{value:JSON.stringify(data.data)};}
  if(key==="tt:pin")return{value:"auth"};
  if(key.startsWith("tt:att:")){const id=key.slice(7);const {data,error}=await sb.storage.from("receipts").download(BIZ.id+"/"+id+".jpg");if(error)throw error;return{value:await blobToDataUrl(data)};}
  throw new Error("nf");},
 async set(key,value){if(!BIZ)throw new Error("no business");
  if(key==="tt:data"){const {error}=await sb.from("business_data").upsert({business_id:BIZ.id,data:JSON.parse(value),updated_at:new Date().toISOString(),updated_by:SESSION.user.id});if(error)throw error;return{};}
  if(key==="tt:pin")return{};
  if(key.startsWith("tt:att:")){const id=key.slice(7);const {error}=await sb.storage.from("receipts").upload(BIZ.id+"/"+id+".jpg",dataUrlToBlob(value),{upsert:true,contentType:"image/jpeg"});if(error)throw error;return{};}
  return{};},
 async delete(key){if(key==="tt:data"){await sb.from("business_data").delete().eq("business_id",BIZ.id);return{};}if(key.startsWith("tt:att:")){await sb.storage.from("receipts").remove([BIZ.id+"/"+key.slice(7)+".jpg"]);}return{};},
 async list(prefix){if(prefix&&prefix.startsWith("tt:att:")){const {data}=await sb.storage.from("receipts").list(BIZ.id);return{keys:(data||[]).map(f=>"tt:att:"+f.name.replace(/\.jpg$/,""))};}return{keys:[]};}
};
async function loadBiz(){const {data}=await sb.from("members").select("business_id,businesses(id,name,join_code)").eq("user_id",SESSION.user.id);BIZLIST=(data||[]).map(r=>r.businesses).filter(Boolean);let saved=null;try{saved=localStorage.getItem("tt:biz");}catch(e){}BIZ=BIZLIST.find(b=>b.id===saved)||BIZLIST[0]||null;if(BIZ)try{localStorage.setItem("tt:biz",BIZ.id);}catch(e){}}
async function createBiz(name){const {data,error}=await sb.from("businesses").insert({name,created_by:SESSION.user.id}).select().single();if(error)throw error;const {error:e2}=await sb.from("members").insert({business_id:data.id,user_id:SESSION.user.id,role:"owner"});if(e2)throw e2;BIZ=data;try{localStorage.setItem("tt:biz",BIZ.id);}catch(e){}}
async function joinBiz(code){const {error}=await sb.rpc("join_business",{code});if(error)throw error;await loadBiz();}

async function signUp(email,pw){const {data,error}=await sb.auth.signUp({email,password:pw});if(error)throw error;return data;}

const paidOf=r=>(r.pays||[]).reduce((a,p)=>a+num(p.amount),0);
const statusOf=r=>{const p=paidOf(r),a=num(r.amount);if(p>=a-0.004)return"paid";if(p>0)return"partial";if(r.due&&r.due<today())return"overdue";return"open"};
function calc(){
 const I=D.invoices,E=D.expenses,F=D.funding;
 const rev=I.reduce((a,x)=>a+num(x.amount),0),coll=I.reduce((a,x)=>a+paidOf(x),0);
 const spend=E.reduce((a,x)=>a+num(x.amount),0),paidOut=E.reduce((a,x)=>a+paidOf(x),0);
 const funded=F.reduce((a,x)=>a+num(x.amount),0);
 const setup=E.filter(x=>T.en.setupCats.includes(x.cat)).reduce((a,x)=>a+num(x.amount),0);
 const M={};const g=k=>M[k]=M[k]||{rev:0,spend:0,in:0,out:0,fund:0};
 I.forEach(x=>{g(x.date.slice(0,7)).rev+=num(x.amount);(x.pays||[]).forEach(p=>g(p.date.slice(0,7)).in+=num(p.amount));});
 E.forEach(x=>{g(x.date.slice(0,7)).spend+=num(x.amount);(x.pays||[]).forEach(p=>g(p.date.slice(0,7)).out+=num(p.amount));});
 F.forEach(x=>g(x.date.slice(0,7)).fund+=num(x.amount));
 const keys=Object.keys(M).sort();
 const monthsActive=Math.max(1,keys.filter(k=>M[k].out>0).length);
 const burn=paidOut/monthsActive;
 const cash=funded+coll-paidOut;
 const ag={cur:0,d30:0,d60:0,d90:0};I.forEach(x=>{const r=num(x.amount)-paidOf(x);if(r<=0.004)return;const ref=x.due||x.date;const d=Math.floor((Date.now()-new Date(ref))/864e5);if(!x.due||d<=0)ag.cur+=r;else if(d<=30)ag.d30+=r;else if(d<=60)ag.d60+=r;else ag.d90+=r;});
 return{ag,rev,coll,owed:rev-coll,spend,paidOut,owe:spend-paidOut,funded,cash,profit:rev-spend,setup,M,keys,burn,runway:burn>0?cash/burn:null,overdue:I.filter(x=>statusOf(x)==="overdue").reduce((a,x)=>a+num(x.amount)-paidOf(x),0)};
}
function people(){const P={};const add=(n,kind,amt,d)=>{P[n]=P[n]||{name:n,owedToYou:0,youOwe:0,invoiced:0,spent:0,last:""};const r=P[n];if(kind==="c"){r.isC=1;r.invoiced+=amt.a;r.owedToYou+=amt.a-amt.p;}else{r.isS=1;r.spent+=amt.a;r.youOwe+=amt.a-amt.p;}if(d>r.last)r.last=d;};
 D.invoices.forEach(x=>add(x.party||"?","c",{a:num(x.amount),p:paidOf(x)},x.date));D.expenses.forEach(x=>add(x.party||"?","s",{a:num(x.amount),p:paidOf(x)},x.date));D.dir=D.dir||{};for(const nm in D.dir){P[nm]=P[nm]||{name:nm,owedToYou:0,youOwe:0,invoiced:0,spent:0,last:""};const g=D.dir[nm]&&D.dir[nm].tag||"";if(g==="c"||g==="b")P[nm].isC=1;if(g==="s"||g==="b")P[nm].isS=1;}return Object.values(P);}

function donut(cats,total){const tot=total||cats.reduce((a,[,v])=>a+v,0)||1;let ang=-Math.PI/2;const cx=75,cy=75,R=62,r=42;
 const arc=(a0,a1,col)=>{const big=a1-a0>Math.PI?1:0;const p=(rad,a)=>[cx+rad*Math.cos(a),cy+rad*Math.sin(a)];const [x0,y0]=p(R,a0),[x1,y1]=p(R,a1),[x2,y2]=p(r,a1),[x3,y3]=p(r,a0);return`<path d="M${x0} ${y0} A${R} ${R} 0 ${big} 1 ${x1} ${y1} L${x2} ${y2} A${r} ${r} 0 ${big} 0 ${x3} ${y3} Z" fill="${col}"/>`};
 let paths="";cats.forEach(([k,v],i)=>{const a1=ang+Math.max(0.0001,v/tot*2*Math.PI-0.02);paths+=arc(ang,a1,COLORS[i%COLORS.length]);ang+=v/tot*2*Math.PI;});

  ${BIZ&&BIZ.join_code?`<div class="fm-card wz-code"><span>${t("wzCode")}</span><b>${esc(BIZ.join_code)}</b></div>`:""}`;
 if(st===5)return`<div class="wz wz-done">${TAMM_MARK("anim")}<h1>${t("wz5t")}</h1><p class="wz-d">${t("wz5d")}</p><div class="dt-card" style="text-align:start">${[["wz5a",I2.plus],["wz5b",I2.cam],["wz5c",I2.home]].map(([k,ic])=>`<div class="dt-row" style="justify-content:flex-start;gap:12px"><span class="wz-ic">${ic}</span><b style="text-align:start;font-weight:500">${t(k)}</b></div>`).join("")}</div><div class="wz-foot"><button class="btn" onclick="wzFinish()">${t("wzGo")}</button></div></div>`;
 return`<div class="wz"><div class="wz-head">${st>1?`<button class="tm-back" aria-label="${t("obBack")}" onclick="wzGo(-1)">${I2.back}</button>`:`<span style="width:40px"></span>`}${wzStepsHTML(st)}<button class="in-link" onclick="wzGo(1,true)">${t("obSkip")}</button></div>${body}<div class="wz-foot"><button class="btn" onclick="wzGo(1)">${t("obContinue")}</button></div></div>`;}
function wzKeep(){const n=document.getElementById("wz_name"),c=document.getElementById("wz_cur");if(n)D.settings.name=n.value.trim()||D.settings.name;if(c)D.settings.cur=c.value;}
function wzAddProd(k){const x=(SUGGEST[wzTmp.type]||[]).filter(x=>!wzTmp.prods.some(p=>p.name===x[0]||p.name===x[1]))[k];if(!x)return;wzTmp.prods.push({id:uid(),name:lang==="ar"?x[1]:x[0],unit:x[2],price:0});render();}
async function wzGo(dir,skip){const o=D.onboard;const st=o.step||1;
 if(dir>0&&!skip){
  if(st===1){wzKeep();D.settings.type=wzTmp.type||"other";}
  if(st===2){D.products=wzTmp.prods.filter(p=>String(p.name||"").trim()).map(p=>({id:p.id||uid(),name:p.name.trim(),unit:p.unit||"piece",price:Number(p.price)||0}));}
  if(st===3){const v=Number((document.getElementById("wz_cash")||{}).value||0),who=((document.getElementById("wz_who")||{}).value||"").trim();o.cash=v||"";o.cashFrom=who;
   const ex=D.funding.find(f=>f.src==="opening");if(v>0){if(ex){ex.amount=v;ex.from=who||"Owner";}else D.funding.push({id:uid(),date:today(),from:who||"Owner",to:"Shop cash",amount:v,ref:lang==="ar"?"نقد البداية":"Opening cash",att:[],src:"opening"});}else if(ex){D.funding=D.funding.filter(f=>f!==ex);}}}
 if(st===1&&dir>0&&skip){wzKeep();}
 o.step=Math.max(1,Math.min(5,st+dir));window.__still=false;await persist();render();try{window.scrollTo({top:0})}catch(e){}}
async function wzInvite(){const em=(document.getElementById("wz_em").value||"").trim(),r=document.getElementById("wz_role").value;if(!em)return;try{const tk=await createInvite(em,r);const l=location.origin+location.pathname+"?invite="+tk;D.onboard.invited=true;persist();document.getElementById("wz_out").innerHTML=`<p class="wz-d" style="margin:8px 0 6px">${t("wzInvited")}</p><code class="wz-link">${esc(l)}</code><button type="button" class="btn line" style="margin-top:8px" onclick="navigator.clipboard.writeText('${l}').then(()=>toast(t('copied')))">${t("copyLink")}</button>`;}catch(e){toast(e.message);}}
async function wzFinish(){D.onboard.done=true;D.onboard.checklist=true;wzTmp=null;tab="home";await persist();render();}
/* ---------- getting-started checklist ---------- */
function ckItems(){const o=D.onboard||{};const anyAtt=[...D.expenses,...D.invoices,...D.funding].some(x=>x.att&&x.att.length);
 return[["exp","ckExp",D.expenses.length>0,"openForm('exp')"],["sale","ckSale",D.invoices.length>0,"openForm('inv')"],["photo","ckPhoto",anyAtt,"snapReceipt()"],["person","ckPerson",Object.values(D.contacts||{}).some(Boolean),"go('people')"],["team","ckTeam",!!o.invited,"go('set')"],["home","ckHome",!!o.a2hs||window.matchMedia("(display-mode: standalone)").matches||navigator.standalone===true,"showA2HS()"]];}
function checklistHTML(){const o=D.onboard;if(!o||!o.checklist||o.checklistHidden||!canEdit())return"";const it=ckItems();const n=it.filter(x=>x[2]).length;
 if(n===it.length)return`<div class="tm-card ck ck-all"><span class="ck-ring" style="--p:100"><b>✓</b></span><b style="flex:1">${t("ckAll")}</b><button class="in-link" onclick="D.onboard.checklistHidden=true;persist();render()">${t("ckHide")}</button></div>`;
 return`<div class="tm-card ck"><div class="ck-head"><span class="ck-ring" style="--p:${Math.round(n/it.length*100)}"><b>${n}</b></span><span style="flex:1"><b>${t("ckTitle")}</b><small>${t("ckOf").replace("{a}",n).replace("{b}",it.length)}</small></span><button class="in-link" onclick="D.onboard.checklistHidden=true;persist();render()">${t("ckHide")}</button></div>
 ${it.map(([k,l,done,act])=>`<button class="ck-row ${done?"done":""}" onclick="${act}"><span class="ck-box">${done?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17 19 7.5"/></svg>':""}</span><span class="ck-l">${t(l)}</span>${done?"":`<span class="ck-go">${I2.back}</span>`}</button>`).join("")}</div>`;}
function showA2HS(){const m=document.getElementById("modal");m.innerHTML=`<div class="sheet dt">${sheetTop(t("a2hsT"))}<div class="dt-card" style="margin-top:14px"><div class="dt-row" style="display:block"><b style="font-weight:500;text-align:start;display:block">${t("a2hsI")}</b></div><div class="dt-row" style="display:block"><b style="font-weight:500;text-align:start;display:block">${t("a2hsA")}</b></div></div><div class="fm-acts"><button class="btn fm-btn primary" onclick="D.onboard=D.onboard||{done:true};D.onboard.a2hs=true;persist();closeModal();render()">${t("a2hsDone")}</button></div></div>`;m.classList.remove("center");m.classList.add("on");}
/* ---------- first-visit tips ---------- */
function tipHTML(key,txt){if(lsGet("tamm:tip:"+key))return"";return`<div class="tip" id="tip-${key}"><span>${txt}</span><button onclick="lsSet('tamm:tip:${key}','1');document.getElementById('tip-${key}').remove()">${t("tipGot")}</button></div>`;}
const _vAct=vAct;vAct=function(){const h=_vAct();return h.replace('</h1></div>','</h1></div>'+tipHTML("act",t("tipAct")));};
const _vPeople=vPeople;vPeople=function(){return tipHTML("people",t("tipPeople"))+_vPeople();};
/* ---------- help & guides ---------- */
function showGuides(){const g=[1,2,3,4,5,6,7];const m=document.getElementById("modal");m.innerHTML=`<div class="sheet dt">${sheetTop(t("hGuides"))}<div class="gd">${g.map(k=>`<details class="gd-i"><summary>${t("g"+k+"t")}</summary><p>${t("g"+k+"d")}</p></details>`).join("")}</div></div>`;m.classList.remove("center");m.classList.add("on");}
function replayIntro(){window.__introReplay=true;introI=0;render();}
function showChecklist(){D.onboard=D.onboard||{done:true};D.onboard.checklist=true;D.onboard.checklistHidden=false;persist();go("home");}
const _vMore=vMore;vMore=function(){const h=_vMore();const help=`<div class="tm-sec" style="margin-top:22px">${t("helpT")}</div><div class="tm-list" style="margin-top:10px">
 <button class="tm-li" onclick="replayIntro()">${I2.home}<span class="f">${t("hHow")}</span></button>
 <button class="tm-li" onclick="showChecklist()">${'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>'}<span class="f">${t("hStart")}</span></button>
 <button class="tm-li" onclick="showGuides()">${I2.doc}<span class="f">${t("hGuides")}</span></button></div>`;
 return tipHTML("more",t("tipMore"))+h+help;};
const _vHome=vHome;vHome=function(){const h=_vHome();const ck=checklistHTML();if(!ck)return h;const i=h.indexOf('<button class="tm-sum"');return i<0?ck+h:h.slice(0,i)+ck+h.slice(i);};

/* auto-update: reload when a new version is published */
const BUILD="b8";
async function checkUpdate(){try{const r=await fetch("version.txt?"+Date.now(),{cache:"no-store"});const v=(await r.text()).trim();if(v&&v!==BUILD){const m=document.getElementById("modal");if(m&&m.classList.contains("on"))return;location.reload();}}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")checkUpdate();});setTimeout(checkUpdate,3000);
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
document.addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{});}
render();boot();sb.auth.onAuthStateChange((ev)=>{if(ev==="SIGNED_OUT"){SESSION=null;unlocked=false;D=null;render();}});
window.addEventListener("focus",async()=>{if(unlocked&&BIZ){try{const r=await window.storage.get("tt:data");const nd=JSON.parse(r.value);if(JSON.stringify(nd)!==JSON.stringify(D)){D=nd;D.contacts=D.contacts||{};D.products=D.products||[];render();}}catch(e){}}});
</script>
