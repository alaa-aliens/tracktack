/* b15 desktop layout
   Reusable wide-screen pieces (>=1024px). Today only the accountant uses them;
   owner/editor/viewer/staff can adopt them by returning dkSide()-style markup:
   .dk-shell   grid: side menu + main column
   .dk-side    sticky left menu (.dk-shop card, .dk-lbl section label, .dk-it item with optional <i> badge, .dk-foot)
   .dk-main    wide main column (overrides the phone max-width of main.tm-main)
   .dk-head    page title row (left: small + h1, right: .dk-head-r actions)
   .dk-grid    two columns (default 1.25fr / 1fr); modifiers .rq (table + 380px panel), .pnl (1.4fr/1fr), .half (1fr/1fr)
   .dk-col     a stacked column inside .dk-grid
   .dk-card    white card used inside columns (tm-card with desktop padding)
   Below 1024px .dk-grid and .dk-col fall back to a single stacked column. */
.dk-grid,.dk-col{display:block}
.dk-col>*+*{margin-top:12px}
@media (min-width:901px){
 .dk-shell{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
 .dk-side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px;padding:24px 16px 20px;border-inline-end:1px solid var(--line);background:var(--paper);overflow:auto}

<div id="splash"><div class="rg"><i></i><svg class="tm-mark anim" viewBox="0 0 115 115" aria-hidden="true"><rect width="115" height="115" rx="30" fill="#202020"/><g transform="translate(5.75 5.75) scale(.9)" fill="none" stroke="#D4FF40" stroke-linecap="round" stroke-linejoin="round"><path class="mk-c" pathLength="1" d="M27.5 60L46 76.5L93.8 49.4" stroke-width="8"/><path class="mk-w" pathLength="1" d="M93.8 49.4C54.8 29.1 28.4 63.9 47.5 77.1C63.4 88.2 88.3 58.5 54.8 52.1C30.2 47.3 19 68.7 17.5 77.1" stroke-width="8"/><path class="mk-s" pathLength="1" d="M99 35.6C95.6 33.8 86.7 29.9 79 29.2" stroke-width="7"/></g></svg></div><div class="tm-wm">Tamm</div><p>Your shop's money, done.</p><div class="dots3"><i></i><i></i><i></i></div></div><script>window.__t0=Date.now();setTimeout(function(){var s=document.getElementById("splash");if(s){s.classList.add("off");setTimeout(function(){s.remove()},500)}},8000);</script>
<div id="app"></div><div class="toast" id="toast"></div>
<script>
/* ================= Tamm backend (Supabase) ================= */
const sb=window.supabase.createClient(TT_CONFIG.supabaseUrl,TT_CONFIG.supabaseKey);
let SESSION=null,BIZ=null,BIZLIST=[];
const dataUrlToBlob=d=>{const [m,b]=d.split(",");const mime=m.match(/:(.*?);/)[1];const bin=atob(b);const arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return new Blob([arr],{type:mime});};
const blobToDataUrl=b=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b);});
/* ---- Safe saving: never silently overwrite a teammate's changes ----
   Each save only succeeds if the shop's data is still the version this phone last loaded.
   If someone else saved in between, their version is fetched, this phone's own changes are
   replayed on top of it (record by record), and the save is tried again. */
const clone=o=>JSON.parse(JSON.stringify(o??null));
const SYNC={base:null,at:null,q:Promise.resolve(),pending:0};
const LISTS=["invoices","expenses","funding","products"],MAPS=["settings","contacts","dir","onboard"];
function merge3(base,mine,theirs){base=base||{};mine=mine||{};theirs=theirs||{};const out=clone(theirs);const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
 for(const k of new Set([...Object.keys(mine),...Object.keys(base)])){
  if(LISTS.includes(k)&&(Array.isArray(mine[k])||Array.isArray(base[k]))){
   const B=new Map((base[k]||[]).map(x=>[x&&x.id,x])),M=new Map((mine[k]||[]).map(x=>[x&&x.id,x]));const T=(theirs[k]||[]).slice();
   let res=T.filter(x=>!(B.has(x&&x.id)&&!M.has(x&&x.id)));/* I deleted it */
   res=res.map(x=>{const m=M.get(x&&x.id);const b=B.get(x&&x.id);if(!(m&&!same(m,b)))return x;
    if(!b||same(x,b)||!x||typeof x!=="object")return m;
    /* both sides changed this record: merge field by field. A field I changed takes my value, every other field keeps theirs */
    const r=clone(x);for(const f of new Set([...Object.keys(m),...Object.keys(b)])){if(same(m[f],b[f]))continue;if(f in m)r[f]=clone(m[f]);else delete r[f];}
    /* lists both sides may add to (payments, receipt photos): keep my list plus what they added */
    const pk=p=>p&&typeof p==="object"&&p.id?p.id:JSON.stringify(p);
    for(const f of ["pays","att"]){if(same(m[f],b[f])||!Array.isArray(x[f]))continue;const bk=new Set((Array.isArray(b[f])?b[f]:[]).map(pk)),mine2=Array.isArray(m[f])?m[f]:[],mk=new Set(mine2.map(pk));const add=x[f].filter(p=>!bk.has(pk(p))&&!mk.has(pk(p)));if(add.length)r[f]=[...clone(mine2),...clone(add)];}
    return r;});/* I edited it; fields and payments/photos someone else changed on the same record are kept */
   const have=new Set(res.map(x=>x&&x.id));for(const m of (mine[k]||[]))if(!have.has(m&&m.id)&&!B.has(m&&m.id))res.push(m);/* I added it */
   out[k]=res;}
  else if(MAPS.includes(k)&&mine[k]&&typeof mine[k]==="object"&&!Array.isArray(mine[k])){
   const b=base[k]||{},m=mine[k],o=Object.assign({},theirs[k]||{});
   for(const kk of new Set([...Object.keys(m),...Object.keys(b)])){if(!(kk in m))delete o[kk];else if(!same(m[kk],b[kk]))o[kk]=m[kk];}
   out[k]=o;}
  else if(!same(mine[k],base[k])){if(k in mine)out[k]=clone(mine[k]);else delete out[k];}
 }
 return out;}
function saveData(local){const run=async()=>{let mine=clone(local);
 for(let tries=0;tries<4;tries++){const now=new Date().toISOString();
  if(SYNC.at==null){const {data:ins,error}=await sb.from("business_data").insert({business_id:BIZ.id,data:mine,updated_at:now,updated_by:SESSION.user.id}).select("updated_at");
   if(!error){SYNC.base=clone(mine);SYNC.at=ins&&ins[0]?ins[0].updated_at:now;return;}if(error.code!=="23505")throw error;}
  else{const {data,error}=await sb.from("business_data").update({data:mine,updated_at:now,updated_by:SESSION.user.id}).eq("business_id",BIZ.id).eq("updated_at",SYNC.at).select("updated_at");
   if(error)throw error;if(data&&data.length){SYNC.base=clone(mine);SYNC.at=data[0].updated_at;return;}}
  /* someone else saved first: fetch theirs and replay my changes on top */
  const {data:cur,error:e2}=await sb.from("business_data").select("data,updated_at").eq("business_id",BIZ.id).maybeSingle();if(e2)throw e2;
  mine=merge3(SYNC.base,mine,cur?cur.data:{});SYNC.at=cur?cur.updated_at:null;SYNC.base=cur?clone(cur.data):null;
  if(typeof D!=="undefined"&&D){D=sanitizeData(clone(mine));try{render();}catch(e){}}
 }
 throw new Error(lang==="ar"?"تعذّر الحفظ، حاول مجددًا":"Couldn't save, please try again");};
 SYNC.pending++;const p=SYNC.q.then(run,run).finally(()=>{SYNC.pending--;});SYNC.q=p.catch(()=>{});return p;}
/* Record ids and photo ids end up inside buttons, so only allow plain letters, digits, - and _ */
const SAFEID=/^[A-Za-z0-9_-]{1,64}$/;
function sanitizeData(d){if(!d||typeof d!=="object")return d;for(const k of LISTS){if(!Array.isArray(d[k]))continue;const seen=new Set();
 d[k]=d[k].filter(x=>x&&typeof x==="object").map(x=>{if(!SAFEID.test(String(x.id))||seen.has(x.id))x.id=Math.random().toString(36).slice(2,9);seen.add(x.id);
  if(Array.isArray(x.att))x.att=x.att.filter(a=>SAFEID.test(String(a)));return x;});}
 return d;}
window.storage={
 async get(key){if(!BIZ)throw new Error("no business");
  if(key==="tt:data"){const {data,error}=await sb.from("business_data").select("data,updated_at").eq("business_id",BIZ.id).maybeSingle();if(error)throw error;if(!data){SYNC.base=null;SYNC.at=null;throw new Error("nf");}SYNC.base=clone(data.data);SYNC.at=data.updated_at;return{value:JSON.stringify(data.data)};}
  if(key==="tt:pin")return{value:"auth"};
  if(key.startsWith("tt:att:")){const id=key.slice(7);const {data,error}=await sb.storage.from("receipts").download(BIZ.id+"/"+id+".jpg");if(error)throw error;return{value:await blobToDataUrl(data)};}
  throw new Error("nf");},
 async set(key,value){if(!BIZ)throw new Error("no business");
  if(key==="tt:data"){await saveData(JSON.parse(value));return{};}
  if(key==="tt:pin")return{};
  if(key.startsWith("tt:att:")){const id=key.slice(7);const {error}=await sb.storage.from("receipts").upload(BIZ.id+"/"+id+".jpg",dataUrlToBlob(value),{upsert:true,contentType:"image/jpeg"});if(error)throw error;return{};}
  return{};},
 async delete(key){if(key==="tt:data"){await sb.from("business_data").delete().eq("business_id",BIZ.id);return{};}if(key.startsWith("tt:att:")){await sb.storage.from("receipts").remove([BIZ.id+"/"+key.slice(7)+".jpg"]);}return{};},
 async list(prefix){if(prefix&&prefix.startsWith("tt:att:")){const {data}=await sb.storage.from("receipts").list(BIZ.id);return{keys:(data||[]).map(f=>"tt:att:"+f.name.replace(/\.jpg$/,""))};}return{keys:[]};}
};
async function loadBiz(){const {data}=await sb.from("members").select("business_id,businesses(id,name,join_code)").eq("user_id",SESSION.user.id);BIZLIST=(data||[]).map(r=>r.businesses).filter(Boolean);let saved=null;try{saved=localStorage.getItem("tt:biz");}catch(e){}BIZ=BIZLIST.find(b=>b.id===saved)||BIZLIST[0]||null;if(BIZ)try{localStorage.setItem("tt:biz",BIZ.id);}catch(e){}}
async function createBiz(name){const {data,error}=await sb.from("businesses").insert({name,created_by:SESSION.user.id}).select().single();if(error)throw error;const {error:e2}=await sb.from("members").insert({business_id:data.id,user_id:SESSION.user.id,role:"owner"});if(e2)throw e2;BIZ=data;try{localStorage.setItem("tt:biz",BIZ.id);}catch(e){}}
async function joinBiz(code){const {data,error}=await sb.rpc("join_business",{code});if(error)throw error;if(!data)throw new Error(lang==="ar"?"الرمز غير صحيح":"Invalid code");try{localStorage.setItem("tt:biz",data);}catch(e){}await loadBiz();}

const paidOf=r=>(r.pays||[]).reduce((a,p)=>a+num(p.amount),0);
const statusOf=r=>{const p=paidOf(r),a=num(r.amount);if(p>=a-0.004)return"paid";if(p>0)return"partial";if(r.due&&r.due<today())return"overdue";return"open"};
function calc(){
 const I=D.invoices,E=D.expenses,F=D.funding;
 const rev=I.reduce((a,x)=>a+num(x.amount),0),coll=I.reduce((a,x)=>a+paidOf(x),0);
 const spend=E.reduce((a,x)=>a+num(x.amount),0),paidOut=E.reduce((a,x)=>a+paidOf(x),0);
 const funded=F.reduce((a,x)=>a+num(x.amount),0);
 const setup=E.filter(x=>T.en.setupCats.includes(x.cat)).reduce((a,x)=>a+num(x.amount),0);
 const M={};const g=k=>M[k]=M[k]||{rev:0,spend:0,in:0,out:0,fund:0};
 I.forEach(x=>{g(x.date.slice(0,7)).rev+=num(x.amount);(x.pays||[]).forEach(p=>g(p.date.slice(0,7)).in+=num(p.amount));});
 E.forEach(x=>{g(x.date.slice(0,7)).spend+=num(x.amount);(x.pays||[]).forEach(p=>g(p.date.slice(0,7)).out+=num(p.amount));});
 F.forEach(x=>g(x.date.slice(0,7)).fund+=num(x.amount));
 const keys=Object.keys(M).sort();
 const monthsActive=Math.max(1,keys.filter(k=>M[k].out>0).length);
 const burn=paidOut/monthsActive;
 const cash=funded+coll-paidOut;
 const ag={cur:0,d30:0,d60:0,d90:0};I.forEach(x=>{const r=num(x.amount)-paidOf(x);if(r<=0.004)return;const ref=x.due||x.date;const d=Math.floor((Date.now()-new Date(ref))/864e5);if(!x.due||d<=0)ag.cur+=r;else if(d<=30)ag.d30+=r;else if(d<=60)ag.d60+=r;else ag.d90+=r;});
 return{ag,rev,coll,owed:rev-coll,spend,paidOut,owe:spend-paidOut,funded,cash,profit:rev-spend,setup,M,keys,burn,runway:burn>0?cash/burn:null,overdue:I.filter(x=>statusOf(x)==="overdue").reduce((a,x)=>a+num(x.amount)-paidOf(x),0)};
}
function people(){const P={};const add=(n,kind,amt,d)=>{P[n]=P[n]||{name:n,owedToYou:0,youOwe:0,invoiced:0,spent:0,last:""};const r=P[n];if(kind==="c"){r.isC=1;r.invoiced+=amt.a;r.owedToYou+=amt.a-amt.p;}else{r.isS=1;r.spent+=amt.a;r.youOwe+=amt.a-amt.p;}if(d>r.last)r.last=d;};
 D.invoices.forEach(x=>{if(x.party&&x.party!=="Shop sales")add(x.party,"c",{a:num(x.amount),p:paidOf(x)},x.date);});D.expenses.forEach(x=>{if(x.party)add(x.party,"s",{a:num(x.amount),p:paidOf(x)},x.date);});D.dir=D.dir||{};for(const nm in D.dir){P[nm]=P[nm]||{name:nm,owedToYou:0,youOwe:0,invoiced:0,spent:0,last:""};const g=D.dir[nm]&&D.dir[nm].tag||"";if(g==="c"||g==="b")P[nm].isC=1;if(g==="s"||g==="b")P[nm].isS=1;}return Object.values(P);}

 if(kind==="inv"&&Number(v.amount)<=0&&Number(v.paidNow)>0){v.amount=v.paidNow;v.items=[{d:v.items[0]&&v.items[0].d||t("qS"),q:1,p:Number(v.paidNow)}];v.desc=v.items[0].d;}
 if(!v.date)return toast(t("date"));if(!v.amount||Number(v.amount)<=0){const pr=document.querySelector('.it-p');if(pr){pr.focus();pr.style.outline='2px solid var(--red)';}return toast(kind==="inv"?t("needPrice"):t("needAmt"));}v.amount=Number(v.amount);
 const list=kind==="fund"?D.funding:kind==="inv"?D.invoices:D.expenses;let rec;
 const old0=id?list.find(r=>r.id===id):null;if(lockedOn(v.date)||(old0&&lockedOn(old0.date)))return toast(t("bkLocked").replace("{d}",niceDate(D.lock)));
 const pf=document.getElementById('pf');const paidNow=(pf&&pf.checked)?Number(v.amount):Number(v.paidNow||0);delete v.paidNow;const method=v.method;delete v.method;
 if(id){rec=list.find(r=>r.id===id);Object.assign(rec,v);if(!canClose())delete rec.rv;}else{rec={id:uid(),...v,pays:[],by:SESSION&&SESSION.user&&SESSION.user.id,at:new Date().toISOString()};if(kind!=="fund"&&paidNow>0)rec.pays.push({date:v.date,amount:paidNow,method});list.push(rec);}
 if(kind!=="fund"||true){rec.att=(rec.att||[]).filter(a=>!removedAtt.includes(a));for(const a of removedAtt){try{await window.storage.delete(ATT+a,true);}catch(e){}}for(const pa of pendingAtt){try{await window.storage.set(ATT+pa.id,pa.d,true);rec.att.push(pa.id);}catch(e){toast("Photo not saved");}}}
 await persist();closeModal();render();showDone(kind,rec.amount,kind==="fund"?rec.from:rec.party);if(share&&kind==="inv")setTimeout(()=>shareInv(rec.id),1200);}
